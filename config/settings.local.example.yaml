# Local overrides for this machine.
#
# Copy to config/settings.local.yaml (gitignored) and edit as needed.
# These values override config/settings.yaml.
# Environment variables (LIBRARIAN_DB_URL, etc.) override both files.

# PostgreSQL connection (override with LIBRARIAN_DB_URL env var)
vector_store:
  backend: pgvector
  pgvector_url: postgresql://localhost:5432/librarian

# Embedding device: cpu, mps (Apple Silicon), or cuda (NVIDIA)
embedding:
  model: BAAI/bge-base-en-v1.5
  device: cpu

# Data paths (override with LIBRARIAN_DATA_ROOT env var)
# library_path: ~/data/librarian/calibre
# output_path: ~/data/librarian/converted
# intake_path: ~/data/librarian/intake/ebooks

# Classification LLM (optional — for librarian-classify)
# classification:
#   provider: ollama
#   model: llama3.2

# Kindle DRM (optional — device serial for DRM decryption)
# kindle_serial: YOUR_DEVICE_SERIAL
