# Librarian Configuration
#
# This file ships with generic defaults. For machine-specific overrides,
# copy config/settings.local.example.yaml → config/settings.local.yaml
# and edit as needed. Environment variables override both files.

# =============================================================================
# Data Paths
# =============================================================================

intake_path: ~/data/librarian/intake/ebooks      # Drop zone for PDFs/EPUBs
kindle_intake_path: ~/data/librarian/intake/kindle
captures_path: ~/data/librarian/intake/captures

# Extracted text output (intermediate processing)
output_path: ~/data/librarian/converted

# =============================================================================
# Vector Store (PostgreSQL + pgvector)
# =============================================================================
#
# Override with LIBRARIAN_DB_URL env var.

vector_store:
  backend: pgvector
  pgvector_url: postgresql://localhost:5432/librarian

  # Collection names
  collection: librarian_full
  equation_collection: librarian_equations
  chapter_collection: librarian_chapters

# =============================================================================
# Embedding Model
# =============================================================================

embedding:
  model: BAAI/bge-base-en-v1.5
  dim: 768
  device: cpu  # cpu, mps (Apple Silicon), or cuda
  batch_size: 48  # embed batch size; larger improves CPU/GPU throughput

# =============================================================================
# Chunking
# =============================================================================
# Sizes are TOKENS and apply to BOTH the block path and the markdown fallback.
# BGE's max sequence length is 512 tokens — anything longer is truncated at
# embed time — so we target well under that (token counts also drift between
# the splitter's tokenizer and BGE's).

chunking:
  chunk_size: 320    # tokens per chunk
  chunk_overlap: 64  # tokens

# =============================================================================
# Classification LLM
# =============================================================================

classification:
  provider: ollama        # or "anthropic" for Claude
  model: llama3.2         # Ollama model, or claude-sonnet-4-20250514 for Anthropic
  sample_size: 5000       # chars to sample from book for classification
