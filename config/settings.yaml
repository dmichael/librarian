# Librarian Configuration

# =============================================================================
# Data Paths (all source data lives in ~/data/librarian/)
# =============================================================================

library_path: ~/data/librarian/calibre           # Calibre library (books + metadata)
intake_path: ~/data/librarian/intake/ebooks      # Drop zone for PDFs/EPUBs
kindle_intake_path: ~/data/librarian/intake/kindle  # Synced from Kindle device
captures_path: ~/data/librarian/intake/captures  # Screenshots for manual OCR workflow

# Extracted text output (intermediate processing)
output_path: ~/data/librarian/converted

# Pipeline state tracked in Calibre custom columns:
# - *status: imported, drm_failed, extracted, indexed
# - *format_type: pdf, epub, kindle
# - *drm_status: none, stripped, requires_manual
# - *drm_diagnosis: JSON with failure details

# =============================================================================
# Vector Store (PostgreSQL + pgvector)
# =============================================================================

vector_store:
  backend: pgvector
  pgvector_url: postgresql://dmichael@agents.local:5432/librarian

  # Collection names
  collection: librarian_full
  equation_collection: librarian_equations
  chapter_collection: librarian_chapters

# =============================================================================
# Embedding Model
# =============================================================================

embedding:
  model: BAAI/bge-base-en-v1.5  # Good balance of quality/speed for Apple Silicon
  dim: 768
  device: mps  # Apple Silicon GPU, or "cpu" for fallback

# =============================================================================
# Chunking
# =============================================================================

chunking:
  chunk_size: 512   # tokens
  chunk_overlap: 50  # tokens

# =============================================================================
# Kindle DRM
# =============================================================================

kindle_serial: GR73H30154540QV4  # Device serial for DRM decryption

# =============================================================================
# Classification LLM
# =============================================================================

classification:
  provider: ollama        # or "anthropic" for Claude
  model: llama3.2         # Ollama model, or claude-sonnet-4-20250514 for Anthropic
  sample_size: 5000       # chars to sample from book for classification
