# Production compose — pulls from a registry.
#
# Usage:
#   1. Build/push/deploy in one step: make deploy
#   2. Ensure .env.librarian exists on target host with DB/Modal settings
#   3. Optional manual run:
#      LIBRARIAN_IMAGE=agents.local:5000/librarian:<tag> \
#      docker compose -f docker-compose.prod.yml up -d

services:
  librarian:
    image: ${LIBRARIAN_IMAGE:-agents.local:5000/librarian:latest}
    ports:
      - "8811:8811"
    env_file: .env.librarian
    volumes:
      - ${HOME}/data/librarian:/data/librarian
    restart: unless-stopped
