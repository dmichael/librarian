[project]
name = "librarian"
version = "0.1.1"
description = "Personal knowledge base for agent intelligence"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    # PDF extraction is delegated to remote marker services:
    #   --spark    => HTTP to the LAN Spark marker-service
    #   --cloud    => Modal A100s via the [cloud] optional extra
    # No local marker-pdf install — librarian containers run on
    # GPU-less hosts.
    # Embedding pipeline
    "llama-index-core>=0.12.0",
    "llama-index-vector-stores-qdrant>=0.4.0",
    "llama-index-embeddings-huggingface>=0.4.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.3.0",
    # Classification
    "httpx>=0.27.0",  # For Ollama API calls
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]  # For Claude classification
cloud = ["modal>=0.60.0"]  # For cloud GPU extraction
lancedb = [
    "llama-index-vector-stores-lancedb>=0.4.0",
    "lancedb>=0.5.0",
    "pandas>=2.0.0",  # Required by llama-index-vector-stores-lancedb
]  # Alternative vector store backend
chroma = [
    "chromadb>=0.4.0",
    "llama-index-vector-stores-chroma>=0.5.0",
]  # Alternative vector store backend
pgvector = [
    "llama-index-vector-stores-postgres>=0.6.0",
    "psycopg[binary]>=3.1.0",
]  # PostgreSQL pgvector backend
serve = [
    "mcp[cli]>=1.20.0",
    "psycopg[binary]>=3.1.0",
    "psycopg2-binary>=2.9.0",
    "llama-index-vector-stores-postgres>=0.6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.18.0",
    "modal>=0.60.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "pylatexenc>=2.10",
]  # MCP server with full pipeline

[project.scripts]
# Main commands
librarian-pipeline = "librarian.intake:pipeline_main"
librarian-init = "librarian.intake:init_main"
librarian-intake = "librarian.intake:intake_main"
librarian-extract = "librarian.extract:main"
librarian-extract-cloud = "librarian.cloud_extract:main"
librarian-index = "librarian.index:main"
librarian-status = "librarian.calibre:status_main"
# Query and search
librarian-query = "librarian.query:main"
librarian-ask = "librarian.ask:main"
librarian-read = "librarian.read:main"
# Utilities
librarian-classify = "librarian.classify:main"
librarian-enrich = "librarian.enrich:main"
librarian-validate = "librarian.enrich:validate_main"
librarian-benchmark = "librarian.benchmark:main"
librarian-stats = "librarian.stats:main"
librarian-toc = "librarian.stats:toc_main"
librarian-extraction-qa = "librarian.extraction_qa:main"
librarian-reconcile = "librarian.reconcile_cli:main"
librarian-references = "librarian.references_cli:main"
# Legacy (deprecated)
librarian-ingest = "librarian.ingest:main"
librarian-kindle-sync = "librarian.ingest:kindle_sync_main"
librarian-kindle-extract = "librarian.kindle_extract:main"
# MCP server
librarian-serve = "librarian.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/librarian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require indexed data)",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
